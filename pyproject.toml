[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "project-genesis"
version = "0.1.0"
description = "A persistent artificial world for autonomous-agent and civilization research"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Project Genesis contributors" }]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
genesis = "genesis.__main__:main"

[tool.setuptools.packages.find]
include = ["genesis*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
